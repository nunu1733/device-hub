[package]
name = "devhub-hid"
version = "0.1.0"
edition = "2021"
description = "HID transport layer for Device HUB. Implements devhub_core::backend over real hardware."

[dependencies]
devhub-core = { path = "../devhub-core" }
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 公式 configurator (hub.xsyd.top) のエクスポート復号 (CryptoJS AES / EVP_BytesToKey)
aes = "0.8"
cbc = "0.1"
md-5 = "0.10"
base64 = "0.22"
# Logitech 戻るボタンの Esc 置換 (WH_MOUSE_LL + SendInput)
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
